# =============================================================================
#  构建系统配置：告诉 pip 用什么东西来“编译/安装”这个项目
# =============================================================================
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# =============================================================================
#  项目基本元信息（名称、版本、描述、Python 版本要求）
# =============================================================================
[project]
name = "yingwu"
version = "0.0.0"
description = "A simple AI agent for everything you need done."
requires-python = ">=3.10"

# -----------------------------------------------------------------------------
#  核心依赖（pip install 这个项目时会自动安装的包）
# -----------------------------------------------------------------------------
dependencies = [
    # ---- AI 模型官方 SDK（调用各大模型供应商的 API） ----
    "openai>=1.0", # 调用 OpenAI GPT 系列模型
    "anthropic>=0.40",  # 调用 Anthropic Claude 系列模型（原生 Messages API）
    "google-genai>=1.0",  # 调用 Google Gemini 系列模型（原生 SDK）
    "google-auth>=2.23",  # Google 身份认证库（用于 Vertex AI 等服务账号认证）

    # ---- 终端界面 & Web 服务 ----
    "textual>=1.0", # 终端 TUI 框架，用来在命令行里展示好看的界面
    "fastapi>=0.110", # 现代化的 Web 框架，用来提供 HTTP API 服务
    "uvicorn[standard]>=0.27",# ASGI 服务器，让 FastAPI 应用能真正跑起来

    # ---- AI 工具调用 & 追踪 ----
    # 目前从 GitHub 的特定提交安装 aisuite（提供工具包、追踪能力），
    # 等 aisuite 发布新版本后会改为普通 PyPI 固定版本，如 "aisuite>=x.y"
    "aisuite @ git+https://github.com/andrewyng/aisuite.git@1b4bbf303ec21968230b1ec869a144d054e9b3c4",

    # ---- 文档解析 ----
    "docstring_parser",# 从函数文档字符串里提取参数/返回值信息（用于工具描述）

    # ---- 配置文件解析 ----
    "pyyaml>=6",  # 读写 YAML 文件（项目中 persona 配置就是用 YAML 写的）

    # ---- 数据校验 ----
    "pydantic>=2", # 基于类型注解的数据校验库，帮你自动检查数据格式

    # ---- 外部协议客户端 ----
    "mcp>=1.1,<2",  # MCP（模型上下文协议）客户端，让 AI 能调用外部工具

    # ---- 网络请求 ----
    "httpx>=0.27",  # 现代化的 HTTP 客户端（用于向 Slack、Telegram 等发送消息）

    # ---- 实时通信 ----
    "websockets>=13",  # WebSocket 协议支持（用于 Slack Relay 客户端）

    # ---- 网页搜索（默认引擎） ----
    "ddgs>=9",  # DuckDuckGo 搜索库，作为免费、无需 API Key 的默认搜索工具

    # ---- 定时任务调度 ----
    "croniter>=2",   # 解析 Cron 表达式，计算下一次触发时间（用于自动化调度）

    # ---- PDF 附件处理 ----
    # 对于不支持直接读取 PDF 的模型，需要先提取内容：
    # pypdf：纯 Python 提取文字
    "pypdf>=5",
    # pypdfium2：将 PDF 页面渲染成图片（底层使用 BSD 授权的 PDFium，不是 AGPL 的 PyMuPDF）
    "pypdfium2>=4",

    # ---- 时区数据库（仅限 Windows） ----
    # Windows 没有系统级的时区数据库，必须额外安装才能让定时任务正确处理时区
    "tzdata; sys_platform == 'win32'",
]

# -----------------------------------------------------------------------------
#  可选依赖组（需要显式指定才会安装，例如 pip install .[messaging]）
# -----------------------------------------------------------------------------
[project.optional-dependencies]
# 开发/测试工具
dev = [
    "pytest>=8", # 测试框架
    "pytest-asyncio",# 让 pytest 支持异步测试
    "httpx"# 测试中需要模拟 HTTP 请求（注意核心依赖里已经有 httpx，这里指定是为了测试环境）
]

# 消息平台连接器（接收来自聊天应用的消息）
messaging = [
    "python-telegram-bot>=21", # Telegram Bot 开发库
    "slack-bolt>=1.18", # Slack 应用框架
    "aiohttp>=3.9" # 异步 HTTP 库（Slack Bolt Socket Mode 底层传输用）
]

# 浏览器自动化
browser = [
    "playwright>=1.44"# 控制 Chrome/Firefox/WebKit 自动操作网页
]

# AWS Bedrock 模型支持
bedrock = [
    "boto3>=1.34" # AWS 官方 Python SDK（访问 Bedrock 等服务时需要）
]

# =============================================================================
#  命令行入口：安装后可直接在终端使用的命令
# =============================================================================
[project.scripts]
# 运行 openworker 命令会执行 yingwu.cli 模块里的 main 函数
openworker = "yingwu.cli:main"
# 启动 Web 服务器
openworker-server = "yingwu.server.run:main"
# 管理消息连接器
openworker-connectors = "yingwu.connectors.cli:main"

# =============================================================================
#  setuptools 配置：告诉它应该打包哪些 Python 包（目录）
# =============================================================================
[tool.setuptools.packages.find]
# 从当前目录开始寻找包
where = ["."]
# 只打包名称以 "yingwu" 开头的目录，避免把 tests、docs 等无关文件夹打包进去
include = ["yingwu*"]

# 打包时还要带上哪些非 .py 文件
[tool.setuptools.package-data]
# 把 yingwu/personas/builtin/ 下面所有的 .md 文件也打包进去（内置人格模板）
yingwu = ["personas/builtin/*.md"]

# =============================================================================
#  pytest 测试运行器的默认配置
# =============================================================================
[tool.pytest.ini_options]
# 测试文件所在的目录
testpaths = ["tests"]
# 自动检测并使用 asyncio 模式（不用在每个测试函数上写装饰器）
asyncio_mode = "auto"
